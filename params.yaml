data:
  train_size: 0.70
  test_size: 0.30
  random_seed: 42

model:
  active: random_forest

  random_forest:
    n_estimators: 250
    max_depth: null
    class_weight: balanced

monitoring:
  ks_pvalue_threshold: 0.05
  chi_square_pvalue_threshold: 0.05
  missing_rate_threshold: 0.05
  accuracy_alert_threshold: 0.75